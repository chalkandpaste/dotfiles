set -g default-shell /bin/zsh
set -g default-terminal 'tmux-256color'
set -as terminal-features ',xterm-256color:RGB'
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g allow-rename off
set -g history-limit 50000
set -g escape-time 10
set -g set-clipboard on
setw -g mode-keys vi
set -g status-style 'bg=#282a2e,fg=#c5c8c6'
set -g pane-border-style 'fg=#373b41'
set -g pane-active-border-style 'fg=#81a2be'
set -g status-left '#[fg=#b5bd68] #S '
set -g status-right '#[fg=#81a2be] %a %H:%M '
setw -g window-status-current-style 'fg=#1d1f21,bg=#81a2be,bold'
bind '|' split-window -h -c '#{pane_current_path}'
bind '-' split-window -v -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'
bind r source-file ~/.tmux.conf \; display-message 'tmux config reloaded'
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'
